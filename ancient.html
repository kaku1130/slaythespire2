und\" class=\"lucide lucide-chevron-left w-4 h-4\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>所有先古之民\u003c/a>\u003cdiv class=\"grid rounded-xl overflow-hidden border border-border\" style=\"background-image:linear-gradient(160deg, #28454F, #0b0b0d 85%)\">\u003cdiv class=\"relative col-start-1 row-start-1 self-start w-full aspect-[32/15]\">\u003cimg alt=\"涅奧\" decoding=\"async\" data-nimg=\"fill\" class=\"object-cover\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/ancient/images/art/neow.webp\"/>\u003c/div>\u003cdiv class=\"relative z-10 col-start-1 row-start-1 self-end bg-gradient-to-t from-background via-background/85 to-transparent px-4 pb-4 pt-16 sm:px-6 sm:pb-6 sm:pt-24\">\u003cdiv class=\"flex items-center gap-4 sm:gap-6\">\u003cdiv class=\"relative rounded-full border border-border/60 overflow-hidden w-16 h-16 sm:w-24 sm:h-24 shrink-0\" style=\"background-image:radial-gradient(circle at 50% 40%, #28454F, #0b0b0d 90%)\">\u003cimg alt=\"涅奧\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain p-[8%]\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/ancient/images/icon/neow.webp\"/>\u003c/div>\u003cdiv class=\"min-w-0\">\u003cdiv class=\"text-2xl sm:text-3xl font-bold\">涅奧\u003c/div>\u003cp class=\"text-muted-foreground mt-1\">復生之母（被放逐）\u003c/p>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-amber-300 border-amber-400/30 bg-amber-500/10\">第 1 幕\u003c/span>\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-muted-foreground border-border bg-background/60\">28 件遺物\u003c/span>\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-muted-foreground border-border bg-background/60\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-lock w-3 h-3\" aria-hidden=\"true\">\u003crect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\">\u003c/rect>\u003cpath d=\"M7 11V7a5 5 0 0 1 10 0v4\">\u003c/path>\u003c/svg>需先解鎖\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"mt-4 space-y-2\">\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-heart-pulse w-4 h-4 mt-0.5 shrink-0 text-emerald-400\" aria-hidden=\"true\">\u003cpath d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\">\u003c/path>\u003cpath d=\"M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27\">\u003c/path>\u003c/svg>造訪先古之民時會將生命值完全恢復（進階 2 以上只恢復已損失生命的 80%）。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>涅奧位於第一幕的起始房間，需先揭示涅奧紀元才會出現。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>有代價的遺物固定出現在第三個位置，另外兩件一定不收取任何代價。這 10 件遺物也只會在涅奧這裡出現。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>若本局帶有修正（自訂遊戲），涅奧會改為提供與修正相關的內容。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003csection id=\"relic-tier-list\" class=\"mt-8\">\u003ch1 class=\"text-2xl font-bold sm:text-3xl\">涅奧最強遺物強度排行\u003c/h1>\u003cp class=\"mt-1 text-sm text-muted-foreground\">涅奧可能提供的 25 件遺物，從必拿到陷阱一次看完。點選可跳到下方完整效果。\u003c/p>\u003cdiv class=\"mt-4 overflow-hidden rounded-lg border border-border\">\u003cdiv class=\"flex items-stretch\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-rose-500/90 text-white\">S\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-lost-coffer\" title=\"失物盒\" aria-label=\"失物盒\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"失物盒\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/lost_coffer.webp\"/>\u003c/a>\u003ca href=\"#relic-phial-holster\" title=\"藥瓶皮套\" aria-label=\"藥瓶皮套\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h \u003c/span>\u003c/a>\u003ca href=\"../../ancient.html\" data-same-tab=\"true\" aria-current=\"page\">\u003cspan aria-hidden=\"true\">🗿\u003c/span>\u003cspan>先古之民\u003c/span>\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"main-content\">\u003cdiv class=\"container mx-auto max-w-5xl px-4 py-8\">\u003cdiv class=\"flex flex-col gap-1.5 mb-4\">\u003cdiv class=\"flex flex-wrap items-center gap-x-2 gap-y-1\">\u003cspan class=\"flex items-center gap-1.5 text-sm font-medium text-foreground\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-left-right h-3.5 w-3.5 text-primary\" aria-hidden=\"true\">\u003cpath d=\"M8 3 4 7l4 4\">\u003c/path>\u003cpath d=\"M4 7h16\">\u003c/path>\u003cpath d=\"m16 21 4-4-4-4\">\u003c/path>\u003cpath d=\"M20 17H4\">\u003c/path>\u003c/svg>切換遊戲版本\u003c/span>\u003cdiv role=\"group\" aria-label=\"切換遊戲版本\" class=\"inline-flex rounded-lg border border-border bg-card/60 p-0.5\">\u003c/div>\u003cspan class=\"text-xs tabular-nums text-muted-foreground/70\">2026-06-18\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003ca class=\"inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-link transition-colors mb-4\" href=\"../../ancient.html\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-left w-4 h-4\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>所有先古之民\u003c/a>\u003cdiv class=\"grid rounded-xl overflow-hidden border border-border\" style=\"background-image:linear-gradient(160deg, #512E66, #0b0b0d 85%)\">\u003cdiv class=\"relative col-start-1 row-start-1 self-start w-full aspect-[32/15]\">\u003cimg alt=\"達弗\" decoding=\"async\" data-nimg=\"fill\" class=\"object-cover\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/ancient/images/art/darv.webp\"/>\u003c/div>\u003cdiv class=\"relative z-10 col-start-1 row-start-1 self-end bg-gradient-to-t from-background via-background/85 to-transparent px-4 pb-4 pt-16 sm:px-6 sm:pb-6 sm:pt-24\">\u003cdiv class=\"flex items-center gap-4 sm:gap-6\">\u003cdiv class=\"relative rounded-full border border-border/60 overflow-hidden w-16 h-16 sm:w-24 sm:h-24 shrink-0\" style=\"background-image:radial-gradient(circle at 50% 40%, #512E66, #0b0b0d 90%)\">\u003cimg alt=\"達弗\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain p-[8%]\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/ancient/images/icon/darv.webp\"/>\u003c/div>\u003cdiv class=\"min-w-0\">\u003cdiv class=\"text-2xl sm:text-3xl font-bold\">達弗\u003c/div>\u003cp class=\"text-muted-foreground mt-1\">囤積者\u003c/p>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-amber-300 border-amber-400/30 bg-amber-500/10\">任何一幕\u003c/span>\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-muted-foreground border-border bg-background/60\">8 件遺物\u003c/span>\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-muted-foreground border-border bg-background/60\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-lock w-3 h-3\" aria-hidden=\"true\">\u003crect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\">\u003c/rect>\u003cpath d=\"M7 11V7a5 5 0 0 1 10 0v4\">\u003c/path>\u003c/svg>需先解鎖\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"mt-4 space-y-2\">\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-heart-pulse w-4 h-4 mt-0.5 shrink-0 text-emerald-400\" aria-hidden=\"true\">\u003cpath d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\">\u003c/path>\u003cpath d=\"M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27\">\u003c/path>\u003c/svg>造訪先古之民時會將生命值完全恢復（進階 2 以上只恢復已損失生命的 80%）。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>達弗是共用的先古之民，任何一幕都可能出現；需先遭遇其他所有先古之民才會解鎖。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>有 50% 機率第三件遺物會換成「塵封古籍」。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003csection id=\"relic-tier-list\" class=\"mt-8\">\u003ch1 class=\"text-2xl font-bold sm:text-3xl\">達弗最強遺物強度排行\u003c/h1>\u003cp class=\"mt-1 text-sm text-muted-foreground\">達弗可能提供的 8 件遺物，從必拿到陷阱一次看完。點選可跳到下方完整效果。\u003c/p>\u003cdiv class=\"mt-4 overflow-hidden rounded-lg border border-border\">\u003cdiv class=\"flex items-stretch\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-rose-500/90 text-white\">S\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-pandoras-box\" title=\"潘多拉魔盒\" aria-label=\"潘多拉魔盒\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"潘多拉魔盒\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/pandoras_box.webp\"/>\u003c/a>\u003ca href=\"#relic-runic-pyramid\" title=\"符文金字塔\" aria-label=\"符文金字塔\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"符文金字塔\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/runic_pyramid.webp\"/>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"flex items-stretch border-t border-border\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-orange-500/90 text-white\">A\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-astrolabe\" title=\"星盤\" aria-label=\"星盤\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"星盤\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/astrolabe.webp\"/>\u003c/a>\u003ca href=\"#relic-empty-cage\" title=\"空鳥籠\" aria-label=\"空鳥籠\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"空鳥籠\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/empty_cage.webp\"/>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"flex items-stretch border-t border-border\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-sky-500/90 text-white\">B\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-black-star\" title=\"黑星\" aria-label=\"黑星\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"黑星\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/black_star.webp\"/>\u003c/a>\u003ca href=\"#relic-snecko-eye\" title=\"異蛇之眼\" aria-label=\"異蛇之眼\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"異蛇之眼\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/snecko_eye.webp\"/>\u003c/a>\u003ca href=\"#relic-dusty-tome\" title=\"塵封魔典\" aria-label=\"塵封魔典\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"塵封魔典\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/dusty_tome.webp\"/>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"flex items-stretch border-t border-border\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-emerald-500/90 text-white\">C\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-calling-bell\" title=\"召喚鈴鐺\" aria-label=\"召喚鈴鐺\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"召喚鈴鐺\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/calling_bell.webp\"/>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"mt-3 text-xs text-muted-foreground\">搶先體驗版的社群評級——版本平衡經常調整，僅供參考。\u003c/p>\u003c/section>\u003csection class=\"mt-8\">\u003ch2 class=\"text-xl font-semibold\">達弗的全部遺物\u003c/h2>\u003cp class=\"text-sm text-muted-foreground mt-1\">每次造訪會從以下遺物池中抽出 3 件遺物。\u003c/p>\u003cdiv class=\"mt-4 space-y-6\">\u003cdiv>\u003cdiv class=\"flex flex-wrap items-baseline gap-x-2 gap-y-1 mb-2\">\u003ch3 class=\"font-semibold\">遺物池 1\u003c/h3>\u003cspan class=\"text-xs text-muted-foreground\">從 8 件中提供 3 件\u003c/span>\u003c/div>\u003cdiv class=\"space-y-2\">\u003cdiv id=\"relic-astrolabe\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"星盤\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/astrolabe.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">星盤\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>選擇3張牌進行\u003c/span>\u003cspan class=\"font-medium text-amber-400\">變化\u003c/span>\u003cspan>，然後將這些牌\u003c/span>\u003cspan class=\"font-medium text-amber-400\">升級\u003c/span>\u003cspan>。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-black-star\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"黑星\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/black_star.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">黑星\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan class=\"font-medium text-amber-400\">精英\u003c/span>\u003cspan>敵人在被打敗時多掉落一件遺物。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-calling-bell\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"召喚鈴鐺\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/calling_bell.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">召喚鈴鐺\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>獲得一個獨特的詛咒和3件\u003c/span>\u003cspan class=\"font-medium text-amber-400\">遺物\u003c/span>\u003cspan>。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003cdiv class=\"flex flex-col gap-3 mt-3\">\u003cdiv class=\"flex flex-wrap items-start justify-start gap-3\">\u003ca class=\"database-card-link\" data-card-id=\"CURSE_OF_THE_BELL\" href=\"../../cards.html#card-CURSE_OF_THE_BELL\" target=\"_blank\" rel=\"noopener\" style=\"display:block;width:340px;max-width:100%\">\u003cimg class=\"database-card-image\" src=\"../../assets/cards/images/base/curse-of-the-bell.webp\" alt=\"鈴鐺的詛咒\" width=\"340\" height=\"454\" loading=\"eager\" style=\"display:block;width:100%;height:auto\">\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-empty-cage\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"空鳥籠\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/empty_cage.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">空鳥籠\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>移除\u003c/span>\u003cspan class=\"font-medium text-amber-400\">牌組\u003c/span>\u003cspan>中的2張牌。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-pandoras-box\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"潘多拉魔盒\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/pandoras_box.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">潘多拉魔盒\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan class=\"font-medium text-amber-400\">變化\u003c/span>\u003cspan>所有“\u003c/span>\u003cspan class=\"font-medium text-amber-400\">打擊\u003c/span>\u003cspan>”和“\u003c/span>\u003cspan class=\"font-medium text-amber-400\">防禦\u003c/span>\u003cspan>”。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-sky-300 border-sky-400/30 bg-sky-500/10\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-3 h-3\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>本局沒有清空牌組的修正\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-runic-pyramid\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"符文金字塔\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/runic_pyramid.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">符文金字塔\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>你在回合結束時不再自動丟棄所有\u003c/span>\u003cspan class=\"font-medium text-amber-400\">手牌\u003c/span>\u003cspan>。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-snecko-eye\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"異蛇之眼\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/snecko_eye.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">異蛇之眼\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>每回合多抽2張牌。每場戰鬥開始時獲得混亂效果。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003cdiv class=\"flex flex-col gap-3 mt-3\">\u003cdiv class=\"flex flex-wrap items-start justify-start gap-x-3 gap-y-2\">\u003cdiv class=\"w-full max-w-[288px] font-[family-name:var(--font-card,inherit)]\" style=\"border-style:solid;border-width:14px 24px 16px 18px;border-image:url(/images/card-template/hover_tip_debuff.webp) 43 91 32 55 fill stretch\">\u003cdiv>\u003cdiv class=\"flex items-center gap-1.5\">\u003cspan class=\"text-[15px] font-bold leading-tight\" style=\"color:#EFC851\">\u003cspan>混亂\u003c/span>\u003c/span>\u003cimg src=\"../../assets/monster/powers/confused_power.webp\" alt=\"\" class=\"h-[18px] w-[18px] shrink-0\"/>\u003c/div>\u003cp class=\"mt-0.5 text-[13px] leading-snug\" style=\"color:#FFF6E2\">\u003cspan>你的卡牌耗能會在抽取時變化，範圍為\u003c/span>\u003cspan style=\"color:#87CEEB\">0\u003c/span>\u003cspan>到\u003c/span>\u003cspan style=\"color:#87CEEB\">3\u003c/span>\u003cspan>。\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-dusty-tome\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"塵封魔典\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/dusty_tome.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">塵封魔典\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>獲得一張\u003c/span>\u003cspan class=\"font-medium text-amber-400\">先古牌\u003c/span>\u003cspan>。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003cspan class=\"inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded border text-sky-300 border-sky-400/30 bg-sky-500/10\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-3 h-3\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>50% 機率出現\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"mt-10\">\u003ch2 class=\"text-xl font-semibold\">對話\u003c/h2>\u003cp class=\"text-sm text-muted-foreground mt-1\">先古之民的台詞會依角色與造訪次數而變化。\u003c/p>\u003cdiv class=\"mt-4 space-y-2\">\u003cdetails class=\"rounded-lg border border-border bg-card\">\u003csummary class=\"cursor-pointer px-4 py-3 font-medium\">初次見面\u003c/summary>\u003cdiv class=\"px-4 pb-4 space-y-4\">\u003cdiv>\u003cdiv class=\"space-y-2\">\u ursor-pointer px-4 py-3 font-medium\">儲君\u003c/summary>\u003cdiv class=\"px-4 pb-4 space-y-4\">\u003cdiv>\u003cdiv class=\"text-xs uppercase tracking-wide text-muted-foreground mb-1.5\">第 1 次造訪\u003c/div>\u003cdiv class=\"space-y-2\">\u003cdiv class=\"rounded-lg border border-border/60 px-3 py-2\" style=\"background-color:#3C193159\">\u003cdiv class=\"text-[11px] uppercase tracking-wide text-muted-foreground mb-1\">瓦庫\u003c/div>\u003cdiv class=\"text-sm leading-relaxed whitespace-pre-line text-[#FFF6E2]/90\">\u003cspan>居然是一個星間來客？在這被詛咒的牆內？\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"rounded-lg border border-border/60 px-3 py-2\" style=\"background-color:#3C193159\">\u003cdiv class=\"text-[11px] uppercase tracking-wide text-muted-foreground mb-1\">儲君\u003c/div>\u003cdiv class=\"text-sm leading-relaxed whitespace-pre-line text-[#FFF6E2]/90\">\u003cspan>你知道我麼？\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"rounded-lg border border-border/60 px-3 py-2\" style=\"background-color:#3C193159\">\u003cdiv class=\"text-[11px] uppercase tracking-wide text-muted-foreground mb-1\">瓦庫\u003c/div>\u003cdiv class=\"text-sm leading-relaxed whitespace-pre-line text-[#FFF6E2]/90\">\u003cspan>是啊，我覺得我們可以互相幫助。\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"text-xs uppercase tracking-wide text-muted-foreground mb-1.5\">第 2 次造訪起\u003c/div>\u003cdiv class=\"space-y-2\">\u003cdiv class=\"rounded-lg border border-border/60 px-3 py-2\" style=\"background-color:#3C193159\">\u003cdiv class=\"text-[11px] uppercase tracking-wide text-muted-foreground mb-1\">瓦庫\u003c/div>\u003cdiv class=\"text-sm leading-relaxed whitespace-pre-line text-[#FFF6E2]/90\">\u003cspan>只需付出小小代價，你就可以擁有我的更多力量。\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"text-xs uppercase tracking-wide text-muted-foreground mb-1.5\">第 5 次造訪\u003c/div>\u003cdiv class=\"space-y-2\">\u003cdiv class=\"rounded-lg border border-border/60 px-3 py-2\" style=\"backgrou  const data=JSON.parse(document.getElementById('detail-pane-data').textContent),main=document.getElementById('main-content');
 const filters=main.querySelector(':scope > .filters');if(filters)filters.remove();const list=document.createElement('div');list.className='split-list';while(main.firstChild)list.append(main.firstChild);const body=document.createElement('div');body.className='split-body';body.append(list);if(filters)main.append(filters);main.append(body);main.classList.add('detail-split');
 const panel=document.createElement('section');panel.className='split-detail';panel.hidden=true;panel.setAttribute('aria-label','詳細內容');const heading=document.createElement('h2');heading.className='split-detail-heading';heading.textContent='詳細內容';const frame=document.createElement('iframe');frame.title='詳細內容';frame.hidden=true;heading.hidden=true;panel.append(frame);body.append(panel);
 const choices=[];for(const link of list.querySelectorAll('a[href]')){const key=link.getAttribute('href').split('/').pop();if(!data.pages[key])continue;const item=link.closest('.entry')||link;item.dataset.detailKey=key;if(item.tagName!=='A')item.tabIndex=0;choices.push(item);if(link.classList.contains('details'))link.remove();}
 for(const item of choices){
  const sourceImage=item.querySelector('img'),sourceName=item.querySelector('h2,.font-semibold');
  if(!sourceImage||!sourceName)continue;

  item.classList.add('compact-detail-item');if(item.classList.contains('monster'))item.style.setProperty('--detail-color',({weak:'#aab6c4',normal:'#70bf8b',elite:'#e3bf72',boss:'#dc6c68',summon:'#b595dd'})[item.dataset.encounterType]);
  if(item.classList.contains('event')){const picture=document.createElement('div');picture.className='event-list-picture';picture.append(image);item.append(name,picture);}else item.append(image,name);
 }
 if(choices[0]?.dataset.detailKey.startsWith('ancient-')){

  grid.replaceWith(sections);

 const fittedNames=choices.filter(item=>!item.classList.contains('event')).map(item=>item.querySelector('.compact-detail-name')).filter(Boolean);

 const nameObserver=new ResizeObserver(entries=>{for(const entry of entries)fitListName(entry.target);});for(const name of fittedNames){fitListName(name);nameObserver.observe(name);}

 list.addEventListener('click',event=>{const item=event.target.closest('[data-detail-key]');if(!item||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();open(item.dataset.detailKey);});
 list.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('.entry[data-detail-key]')){event.preventDefault();open(event.target.dataset.detailKey);}});
 frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link)return;const href=link.getAttribute('href');if(href.startsWith('#')){let id;try{id=decodeURIComponent(href.slice(1));}catch{return;}const target=doc.getElementById(id);if(target){event.preventDefault();if(id.startsWith('relic-')){for(const item of doc.querySelectorAll('.is-relic-highlighted'))item.classList.remove('is-relic-highlighted');target.classList.add('is-relic-highlighted');}target.style.scrollMarginTop='16px';target.tabIndex=-1;target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:'instant'});}return;}const url=new URL(href,doc.baseURI),key=url.pathname.split('/').pop();if(data.pages[key]){event.preventDefault();open(key);}else if(url.href.split('#')[0]===location.href.split('#')[0]){event.preventDefault();list.focus();}else{link.target='_blank';link.rel='noopener';}});});
