=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/precarious_shears.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">鬆動羊毛剪\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>從你的\u003c/span>\u003cspan class=\"font-medium text-amber-400\">牌組\u003c/span>\u003cspan>中移除2張牌，然後失去16點生命。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-silken-tress\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(0, 26, 51, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"華美髮束\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/silken_tress.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">華美髮束\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>失去所有\u003c/span>\u003cspan class=\"font-medium text-amber-400\">金幣\u003c/span>\u003cspan>。為第一次卡牌獎勵中的所有牌\u003c/span>\u003cspan class=\"font-medium text-amber-400\">附魔\u003c/span>\u003cspan>：華彩。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003cdiv class=\"flex flex-col gap-3 mt-3\">\u003cdiv class=\"flex flex-wrap items-start justify-start gap-x-3 gap-y-2\">\u003cdiv class=\"w-full max-w-[288px] font-[family-name:var(--font-card,inherit)]\" style=\"border-style:solid;border-width:14px 24px 16px 18px;border-image:url(/images/card-template/hover_tip.webp) 43 91 32 55 fill stretch\">\u003cdiv>\u003cdiv class=\"flex items-center gap-1.5\">\u003cspan class=\"text-[15px] font-bold leading-tight\" style=\"color:#EFC851\">\u003cspan>華彩\u003c/span>\u003c/span>\u003c/div>\u003cp class=\"mt-0.5 text-[13px] leading-snug\" style=\"color:#FFF6E2\">\u003cspan>這張牌每場戰鬥能夠\u003c/span>\u003cspan style=\"color:#EFC851\">重放\u003c/span>\u003cspan>一次。\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"w-full max-w-[288px] font-[family-name:var(--font-card,inherit)]\" style=\"border-style:solid;border-width:14px 24px 16px 18px;border-image:url(/images/card-template/hover_tip.webp) 43 91 32 55 fill stretch\">\u003cdiv>\u003cdiv class=\"flex items-center gap-1.5\">\u003cspan class=\"text-[15px] font-bold leading-tight\" style=\"color:#EFC851\">\u003cspan>重放\u003c/span>\u003c/span>\u003c/div>\u003cp class=\"mt-0.5 text-[13px] leading-snug\" style=\"color:#FFF6E2\">\u003cspan>將這張牌額外打出\u003c/span>\u003cspan style=\"color:#87CEEB\">1\u003c/span>\u003cspan>次。\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-silver-crucible\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(0, 26, 51, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"白銀熔爐\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/silver_crucible.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">白銀熔爐\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>你遇到的前3次卡牌獎勵將是被\u003c/span>\u003cspan class=\"font-medium text-amber-400\">升級\u003c/span>\u003cspan>過的。你打開的第一個寶箱將是空的\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"mt-6\">\u003ch3 class=\"font-semibold\">強弱對應組合\u003c/h3>\u003cp class=\"text-sm text-muted-foreground mt-1\">每件有代價遺物都是某件無代價遺物的強化版。遊戲先抽有代價的那件，再把它較弱的版本從另外兩個位置移除——所以你不會同時看到兩者。\u003c/p>\u003cdiv class=\"mt-3 grid gap-3 sm:grid-cols-2\">\u003cdiv class=\"rounded-lg border border-border bg-card p-3\">\u003cdiv class=\"flex items-start gap-2\">\u003cdiv class=\"relative w-8 h-8 shrink-0\">\u003cimg alt=\"詛咒珍珠\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/cursed_pearl.webp\"/>\u003c/div>\u003cdiv class=\"min-w-0 text-sm\">\u003cspan class=\"font-medium text-amber-400\">詛咒珍珠\u003c/span>\u003cspan class=\"text-muted-foreground\"> — \u003c/span>\u003cspan class=\"text-muted-foreground\">\u003cspan>獲得一張貪婪，獲得333\u003c/span>\u003cspan class=\"font-medium text-amber-400\">金幣\u003c/span>\u003cspan>。\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"text-xs uppercase tracking-wide text-muted-foreground mt-2 mb-1.5\">則不會提供\u003c/div>\u003cdiv class=\"space-y-1.5 opacity-60\">\u003cdiv class=\"flex items-start gap-2\">\u003cdiv class=\"relative w-8 h-8 shrink-0\">\u003cimg alt=\"金色珍珠\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/golden_pearl.webp\"/>\u003c/div>\u003cdiv class=\"min-w-0 text-sm\">\u003cspan class=\"font-medium text-amber-400\">金色珍珠\u003c/span>\u003cspan class=\"text-muted-foreground\"> — \u003c/span>\u003cspan class=\"text-muted-foreground\">\u003cspan>拾起時，獲得150\u003c/span>\u003cspan class=\"font-medium text-amber-400\">金幣\u003c/span>\u003cspan>。\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"rounded-lg border border-border bg-card p-3\">\u003cdiv class=\"flex items-start gap-2\">\u003cdiv class=\"relative w-8 h-8 shrink-0\">\u003cimg alt=\"沉重石板\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/hefty_tablet.webp\"/>\u003c/div>\u003cdiv class=\"min-w-0 text-sm\">\u003cspan class=\"font-medium text-amber-400\">沉重石板\u003c/span>\u003cspan class=\"text-muted-foreground\"> — \u003c/span>\u003cspan class=\"text-muted-foreground\">\u003cspan>從3張稀有牌中選擇1張加入你的\u003c/span>\u003cspan class=\"font-medium text-amber-400\">牌組\u003c/span>\u003cspan>。將1張受傷加入你的\u003c/span>\u003cspan class=\"font-medium text-amber-400\">牌組\u003c/span>\u003cspan>。\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"text-xs uppercase tracking-wide text-muted-foreground mt-2 mb-1.5\">則不會提供\u003c/div>\u003cdiv class=\"space-y-1.5 opacity-60\">\u003cdiv class=\"flex items-start gap-2\">\u003cdiv class=\"relative w-8 h-8 shrink-0\">\u003cimg alt=\"奧術卷軸\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/arcane_scroll.webp\"/>\u003c/div>\u003cdiv class=\"min-w-0 text-sm\">\u003cspan class=\"font-medium text-amber-400\">奧術卷軸\u003c/span>\u003cspan class=\"text-muted-foreground\"> — \u003c/span>\u003cspan class=\"text-muted-foreground\">\u003cspan>獲得一張隨機\u003c/span>\u003cspan class=\"font-medium text-amber-400\">稀有牌\u003c/span>\u003cspan>。\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"rounded-lg border border-border bg-card p-3\">\u003cdiv class=\"flex items-start gap-2\">\u003cdiv class=\"relative w-8 h-8 shrink-0\">\u003cimg alt=\"樹葉藥膏\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/leafy_poultice.webp\"/>\u003 5 0 0 1 10 0v4\">\u003c/path>\u003c/svg>需先解鎖\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"mt-4 space-y-2\">\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-heart-pulse w-4 h-4 mt-0.5 shrink-0 text-emerald-400\" aria-hidden=\"true\">\u003cpath d=\"M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5\">\u003c/path>\u003cpath d=\"M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27\">\u003c/path>\u003c/svg>造訪先古之民時會將生命值完全恢復（進階 2 以上只恢復已損失生命的 80%）。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>達弗是共用的先古之民，任何一幕都可能出現；需先遭遇其他所有先古之民才會解鎖。\u003c/p>\u003cp class=\"text-sm text-muted-foreground flex items-start gap-2\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-info w-4 h-4 mt-0.5 shrink-0\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M12 16v-4\">\u003c/path>\u003cpath d=\"M12 8h.01\">\u003c/path>\u003c/svg>有 50% 機率第三件遺物會換成「塵封古籍」。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003csection id=\"relic-tier-list\" class=\"mt-8\">\u003ch1 class=\"text-2xl font-bold sm:text-3xl\">達弗最強遺物強度排行\u003c/h1>\u003cp class=\"mt-1 text-sm text-muted-foreground\">達弗可能提供的 8 件遺物，從必拿到陷阱一次看完。點選可跳到下方完整效果。\u003c/p>\u003cdiv class=\"mt-4 overflow-hidden rounded-lg border border-border\">\u003cdiv class=\"flex items-stretch\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-rose-500/90 text-white\">S\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-pandoras-box\" title=\"潘多拉魔盒\" aria-label=\"潘多拉魔盒\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"潘多拉魔盒\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/pandoras_box.webp\"/>\u003c/a>\u003ca href=\"#relic-runic-pyramid\" title=\"符文金字塔\" aria-label=\"符文金字塔\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"符文金字塔\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/runic_pyramid.webp\"/>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"flex items-stretch border-t border-border\">\u003cdiv class=\"flex w-12 shrink-0 items-center justify-center px-1 text-center text-xl font-extrabold sm:w-16 sm:text-2xl bg-orange-500/90 text-white\">A\u003c/div>\u003cdiv class=\"flex flex-1 flex-wrap content-center items-center gap-2 bg-card/30 p-2\">\u003ca href=\"#relic-astrolabe\" title=\"星盤\" aria-label=\"星盤\" class=\"relative block h-12 w-12 shrink-0 transition-transform hover:z-10 hover:scale-110 sm:h-14 sm:w-14\">\u003cimg alt=\"星盤\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-c ute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/astrolabe.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">星盤\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan>選擇3張牌進行\u003c/span>\u003cspan class=\"font-medium text-amber-400\">變化\u003c/span>\u003cspan>，然後將這些牌\u003c/span>\u003cspan class=\"font-medium text-amber-400\">升級\u003c/span>\u003cspan>。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-black-star\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"黑星\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/black_star.webp\"/>\u003c/div>\u003cdiv class=\"flex-1 min-w-0\">\u003cdiv class=\"font-semibold text-amber-400\">黑星\u003c/div>\u003cdiv class=\"text-sm leading-relaxed text-[#FFF6E2]/90 mt-0.5\">\u003cspan class=\"font-medium text-amber-400\">精英\u003c/span>\u003cspan>敵人在被打敗時多掉落一件遺物。\u003c/span>\u003c/div>\u003cdiv class=\"flex flex-wrap gap-1.5 mt-2\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"relic-calling-bell\" class=\"rounded-lg border border-border/70 p-3 sm:p-4 scroll-mt-20\" style=\"background-color:rgba(15, 0, 20, 0.5)\">\u003cdiv class=\"flex items-start gap-3\">\u003cdiv class=\"relative w-12 h-12 shrink-0\">\u003cimg alt=\"召喚鈴鐺\" loading=\"eager\" decoding=\"async\" data-nimg=\"fill\" class=\"object-contain\" style=\"position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent\" src=\"../../assets/relic/images/calling_bell.webp\"/>\u003c/div>
