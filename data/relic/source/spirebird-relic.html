<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script src="/reset-rules.js?v=b229944ea046"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirebird · Relic</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#16243a; --navy-2:#1d3050; --accent:#14538a; --accent-solid:#14538a;
    --accent-hi:#1c6fb8; --accent-dp:#0c3a66; --ink:#1a2330; --ink-2:#54616f; --ink-3:#8a96a6;
    --line:#e2e6ec; --line-2:#cfd6de; --surface:#f5f7fa; --surface-2:#eef2f6; --hi:#dcebfb;
    --row-alt:#fafbfd; --row-hover:#eef4fb; --win:#1f8a4c; --loss:#c0392b; --page:#ffffff;
  }
  html[data-theme="dark"] {
    --navy:#0b1320; --navy-2:#16243a; --accent:#6fb4ee; --accent-solid:#27689f;
    --accent-hi:#8fc4f2; --accent-dp:#a7d1f5; --ink:#dce3ec; --ink-2:#9aa7b6; --ink-3:#69768a;
    --line:#232e3c; --line-2:#33414f; --surface:#161f2b; --surface-2:#1b2532; --hi:#1e3a59;
    --row-alt:#131c28; --row-hover:#1c2a3a; --win:#46c47e; --loss:#e0614f; --page:#0e1622;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font-family:"Archivo",system-ui,sans-serif; font-size:14px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }

  .topbar { background: var(--navy); color:#cdd7e4; border-bottom:1px solid var(--line); }
  .topbar .inner { display:flex; align-items:center; gap:22px; padding:0 18px; height:46px; flex-wrap:wrap; }
  .topbar .logo { font-family:"Zilla Slab",serif; font-weight:700; font-size:17px; color:#fff; letter-spacing:.01em; }
  .topbar .logo:hover { text-decoration:none; color:#fff; }
  .topbar nav { display:flex; gap:18px; font-size:13px; font-weight:500; align-items:center; flex-wrap:wrap; }
  .topbar nav a { color:#aebacb; }
  .topbar nav a:hover, .topbar nav a.on { color:#fff; text-decoration:none; }
  .topbar nav .navsep { width:1px; height:15px; background:#36506f; margin:0 -6px; }
  .autharea { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .twpill { display:inline-flex; align-items:center; gap:5px; background:#0f1b2d; border:1px solid #2c4264; color:#cdd7e4; border-radius:5px; padding:6px 11px; font-family:inherit; font-size:13px; cursor:pointer; }
  .twpill.sub { border-color:#9146ff; color:#fff; background:#6441a5; }
  .twpill.login { border-color:#9146ff; color:#cbb8ff; }
  .twlogout { background:none; border:none; color:#8aa0bd; font-size:12px; cursor:pointer; padding:2px 4px; }
  .twlogout:hover { color:#cdd7e4; text-decoration:underline; }
  .twgear { display:inline-flex; align-items:center; gap:5px; background:none; border:1px solid #2c4264; color:#cdd7e4; border-radius:5px; padding:6px 10px; font-family:inherit; font-size:13px; cursor:pointer; }
  .twgear:hover { border-color:#3a5578; color:#fff; }
  .coltip { position:fixed; z-index:50; max-width:280px; display:none; pointer-events:none; background:var(--surface-2); border:1px solid var(--line-2); border-radius:7px; padding:8px 10px; box-shadow:0 6px 20px rgba(0,0,0,.28); }
  .coltip .t { font-family:"Archivo"; font-weight:700; font-size:12px; color:var(--ink); margin-bottom:3px; }
  .coltip .d { font-size:12px; line-height:1.45; color:var(--ink-2); }
  .topbar .logo[data-desc] { cursor:pointer; }
  .themebtn { margin-left:auto; background:#0f1b2d; border:1px solid #2c4264; color:#cdd7e4; border-radius:5px; padding:6px 11px; font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer; }
  .themebtn:hover { color:#fff; border-color:#3d597f; }

  .wrap { max-width:1080px; margin:0 auto; padding:22px 20px 60px; }

  h1.cardname { font-family:"Zilla Slab",serif; font-weight:700; font-size:32px; margin:0 0 2px; color:var(--ink); letter-spacing:.005em; text-align:center; }
  /* Relic-profile header: prev/next links + title. Mobile-first — narrow stacks the
     two links on a row above the title; at >=640px the title moves inline so the
     prev link sits beside it (next pushed to the far right). */
  .profhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin:0 0 6px; }
  .profhead .cardname { margin:0; order:3; flex-basis:100%; }   /* narrow: title drops to its own line */
  .profhead .pnav { color:var(--accent); white-space:nowrap; font-size:13px; font-weight:600; }
  .profhead .pnav.next { margin-left:auto; }                    /* push next-link to the right */
  @media (min-width:640px) {
    /* wide: 3-col grid with equal 1fr flanks so the title sits dead-center regardless of link widths */
    .profhead { display:grid; grid-template-columns:1fr auto 1fr; }
    .profhead .pnav.prev { justify-self:start; }
    .profhead .pnav.next { justify-self:end; margin-left:0; }
    .profhead .cardname { order:0; justify-self:center; }      /* wide: arrows flank the centered title */
  }

  .topgrid { display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap; margin-top:14px; }
  .imgs { display:flex; gap:14px; }
  /* relics are square icons (not 47/64 card portraits) */
  .relicfig img { width:150px; height:150px; object-fit:contain; image-rendering:auto; filter:drop-shadow(0 6px 16px rgba(0,0,0,.45)); border-radius:10px; display:block; background:var(--surface); }
  .relicfig.missing { width:150px; height:150px; display:flex; align-items:center; justify-content:center; border:1px dashed var(--line-2); border-radius:10px; color:var(--ink-3); font-size:12px; }
  .bio { flex:1; min-width:260px; }
  .facts { margin:2px 0 16px; }
  .facts .fact { font-size:13px; line-height:1.6; color:var(--ink-2); }
  .facts .fact b { color:var(--ink); font-weight:700; }
  .rules { font-size:14px; line-height:1.55; color:var(--ink); margin:0 0 12px; max-width:560px; }
  .rules .bb-num { color:var(--accent-hi); font-weight:700; }
  .rules .bb-green { color:var(--win); font-weight:700; }
  .rules .bb-kw { color:#b8860b; font-weight:600; }
  html[data-theme="dark"] .rules .bb-kw { color:#e8c45a; }
  .rules .bb-ench { color:#8a5cc8; font-weight:600; }
  html[data-theme="dark"] .rules .bb-ench { color:#b48ce8; }
  .rules .bb-red { color:var(--loss); font-weight:600; }
  .rules .bb-star { color:#e8c45a; }
  .rules .bb-icon { height:1.05em; width:auto; vertical-align:-.16em; margin:0 1px; }
  .rules .nrg { display:inline-block; width:.78em; height:.78em; border-radius:50%; background:#b9c2cd; border:1px solid rgba(0,0,0,.3); vertical-align:-.04em; margin:0 .5px; }
  html[data-theme="dark"] .rules .nrg { background:#aab6c4; border-color:rgba(0,0,0,.5); }
  .rules .nrg-necro { background:#a472d6; }
  .flavor { font-size:13px; line-height:1.5; color:var(--ink-3); font-style:italic; margin:0 0 14px; max-width:560px; }
  .streakwrap { display:flex; gap:12px; flex-wrap:wrap; align-content:flex-start; margin-top:4px; }
  .streakbox { min-width:170px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:11px 14px; }
  .streakbox .lbl { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px; }
  .streakbox .big { font-family:"Zilla Slab",serif; font-weight:700; font-size:32px; line-height:1; color:var(--win); }
  .streakbox .big.zero { color:var(--ink-3); }
  .streakbox .span { margin-top:6px; font-size:12px; color:var(--ink-2); }
  .streakbox .bcyc { margin-top:6px; display:flex; align-items:center; gap:6px; }
  .streakbox .bcyc .bcyclbl { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); min-width:64px; text-align:center; }
  .streakbox .bcycbtn { background:none; border:1px solid var(--line); border-radius:5px; color:var(--ink-2); font-size:14px; line-height:1; padding:1px 7px 3px; cursor:pointer; }
  .streakbox .bcycbtn:hover { color:var(--ink-1); border-color:var(--ink-3); }
  .bchartwrap { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:14px; margin-top:14px; }
  .bchart { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .bchart-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .bchart-title { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
  .bchart .bcyc { display:flex; align-items:center; gap:6px; }
  .bchart .bcyclbl { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); min-width:60px; text-align:center; }
  .bchart .bcycbtn { background:none; border:1px solid var(--line); border-radius:5px; color:var(--ink-2); font-size:14px; line-height:1; padding:1px 7px 3px; cursor:pointer; }
  .bchart .bcycbtn:hover { color:var(--ink-1); border-color:var(--ink-3); }
  .bchart-host { min-height:60px; }
  .bchart-empty { padding:28px 4px; color:var(--ink-3); font-size:13px; text-align:center; }
  .streakbox .ctx { margin-top:3px; font-size:11px; color:var(--ink-3); }
  .streakmuted { color:var(--ink-3); font-size:13px; align-self:center; }
  .facts .rar-Uncommon { color:#3f86c8; font-weight:700; } .facts .rar-Rare { color:#a8801f; font-weight:700; }
  .facts .rar-Ancient { color:#8a5cc8; font-weight:700; } .facts .rar-Shop { color:#1f8a4c; font-weight:700; }
  html[data-theme="dark"] .facts .rar-Uncommon { color:#5aa6e8; } html[data-theme="dark"] .facts .rar-Rare { color:#e8c45a; }
  html[data-theme="dark"] .facts .rar-Ancient { color:#b48ce8; } html[data-theme="dark"] .facts .rar-Shop { color:#46c47e; }

  /* SUMMARY career strip */
  .summary { display:flex; align-items:stretch; border:1px solid var(--line-2); border-radius:7px; overflow:hidden; margin-bottom:16px; width:fit-content; max-width:100%; }
  .summary .lead, .summary .col { padding:5px 14px; text-align:right; }
  .summary .lead { text-align:left; border-right:1px solid var(--line-2); background:var(--surface); display:flex; flex-direction:column; justify-content:center; }
  .summary .lead-top { font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink); }
  .summary .lead-bot { font-size:11.5px; color:var(--ink-3); margin-top:2px; white-space:nowrap; }
  .summary .col + .col { border-left:1px solid var(--line); }
  .summary .col .h { font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); }
  .summary .col .v { font-size:16px; font-weight:700; color:var(--ink); margin-top:2px; font-variant-numeric:tabular-nums; }

  .section { margin-top:34px; }
  .section > h2 { font-family:"Zilla Slab",serif; font-weight:700; font-size:20px; color:var(--accent-dp); margin:0 0 12px; border-bottom:1px solid var(--line-2); padding-bottom:5px; letter-spacing:.005em; }

  .controls { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .controls label { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin-right:6px; }
  .controls select { font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--surface-2); border:1px solid var(--line-2); border-radius:6px; padding:5px 9px; cursor:pointer; }
  .controls #patchList{font-variant-numeric:tabular-nums}
  .controls #patchList a.patchlink{text-decoration:none}
  .controls #patchList a.patchlink:hover{text-decoration:underline}
  .controls #patchList b.patchcur{font-weight:700}
  .relicfig.missing.era { flex-direction:column; gap:8px; padding:12px; text-align:center; }
  .relicfig .eranote { font-size:12px; font-style:italic; color:var(--ink-2); max-width:220px; }

  table.stats { border-collapse:collapse; width:100%; max-width:700px; border:1px solid var(--line); margin-bottom:8px; }
  table.stats th, table.stats td { padding:4px 12px; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; font-size:12.5px; }
  table.stats thead th { font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); background:var(--surface); border-bottom:2px solid var(--accent-solid); }
  table.stats td.name, table.stats th.name { text-align:left; color:var(--ink); font-weight:600; border-right:1px solid var(--line); }
  table.stats td.val { font-weight:700; color:var(--ink); }
  table.stats td.rank { font-size:11.5px; font-weight:700; }
  table.stats td.rank .of { font-weight:500; color:var(--ink-3); font-size:10.5px; }
  table.stats tbody tr:hover td { background:var(--row-hover); }
  table.stats td.name[title], .summary .col[title], .summary .lead[title] { cursor:help; }
  table.stats td.name[title] { text-decoration:underline dotted var(--line-2); text-underline-offset:3px; text-decoration-thickness:1px; }
  table.stats .grp td { background:var(--surface-2); font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); text-align:left; border-bottom:1px solid var(--line-2); }
  /* by-character table reuses table.stats but every column is numeric/centered-right */
  table.stats td.ch { text-align:left; color:var(--ink); font-weight:600; border-right:1px solid var(--line); }

  .muted { color:var(--ink-3); }
  .err { color:var(--loss); font-weight:600; padding:30px 0; }

  /* index / browse */
  .idxhead { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .idxhead h1 { font-family:"Zilla Slab",serif; font-weight:700; font-size:30px; margin:0; color:var(--ink); }
  .idxsearch { font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line-2); border-radius:7px; padding:8px 12px; width:280px; }
  .filterbar { margin-bottom:16px; }
  .filterbar .count { color:var(--ink-3); font-size:12px; margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:14px; }
  .tile { display:block; text-align:center; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
  .tile:hover { background:var(--row-hover); text-decoration:none; border-color:var(--line-2); }
  .tile .thumb { display:block; aspect-ratio:1/1; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .tile .thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .tile .thumb.noimg, .tile .ph { display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-3); font-size:11px; }
  .tile .nm { margin-top:6px; font-size:12px; font-weight:600; color:var(--ink); }
  .tile { position:relative; }
  .tile .ancbadge { position:absolute; top:6px; left:6px; display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px 6px 2px 5px; pointer-events:none; }
  .tile .ancbadge .dot { width:7px; height:7px; border-radius:50%; flex:none; }

  .chart-wrap { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 14px 6px; max-width:640px; }
  .chart-wrap svg { width:100%; height:auto; display:block; }
  .pairs { display:flex; gap:26px; flex-wrap:wrap; }
  .paircol { flex:1; min-width:320px; }
  .paircol h3 { font-family:"Archivo"; font-weight:700; font-size:13px; color:var(--ink); margin:0 0 8px; }
  table.pair { border-collapse:collapse; width:100%; }
  table.pair td { padding:6px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:12.5px; }
  table.pair td.nm { text-align:left; font-weight:600; }
  table.pair td.flow { text-align:right; color:var(--ink-2); white-space:nowrap; }
  table.pair td.lift { text-align:right; font-weight:700; color:var(--win); white-space:nowrap; }
  table.pair td.n { text-align:right; color:var(--ink-3); font-size:11px; }

  /* comments */
  .cform { display:flex; gap:8px; margin-bottom:14px; }
  .cform textarea { flex:1; font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; resize:vertical; }
  .cform button { font-family:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--accent-solid); border:1px solid var(--accent-solid); border-radius:7px; padding:0 16px; cursor:pointer; }
  .cform button:disabled { opacity:.55; cursor:default; }
  .cmuted { color:var(--ink-3); font-size:13px; margin-bottom:12px; }
  .clist { display:flex; flex-direction:column; gap:12px; }
  .crow { border:1px solid var(--line); border-radius:10px; padding:11px 14px; background:var(--surface); }
  .cmeta { display:flex; align-items:center; gap:10px; font-size:12px; }
  .cby { font-weight:700; color:var(--ink); }
  .cdate { color:var(--ink-3); }
  .cdel { margin-left:auto; font-size:11px; color:var(--ink-3); background:none; border:none; cursor:pointer; }
  .cdel:hover { color:var(--loss); text-decoration:underline; }
  .ctext { margin:6px 0 9px; font-size:14px; color:var(--ink); white-space:pre-wrap; word-break:break-word; }
  .cvotes { display:flex; gap:22px; }
  .vaxis { display:inline-flex; align-items:center; gap:6px; }
  .vlbl { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); }
  .vbtn { font-family:inherit; font-size:12px; cursor:pointer; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px; padding:1px 7px; }
  .vbtn:hover { color:var(--ink); border-color:var(--ink-3); }
  .vbtn.on { color:#fff; background:var(--accent-solid); border-color:var(--accent-solid); }
  .vnet { min-width:20px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); }
  .pair td.n[data-desc] { cursor: help; }
</style>

<body>
<div class="topbar"><div class="inner">
  <a class="logo" href="/" data-tt="Spirebird" data-desc="A jorbs Community Stats Project for Slay the Spire 2">Spirebird</a>
  <nav id="snav"></nav>
  <script>SpirebirdNav.render('relic','snav');</script>
  <span class="autharea" id="authArea"></span>
  <button class="themebtn" id="themeBtn" aria-label="Toggle dark mode"></button>
</div></div>
<div class="coltip" id="coltip"></div>
<div class="wrap"><div id="content"><p class="muted">Loading…</p></div></div>

<script>
(function () {
  // ---------- theme ----------
  var THEME_KEY = 'sb-theme';
  function applyTheme(t) { document.documentElement.dataset.theme = t; var b = document.getElementById('themeBtn'); if (b) b.textContent = t === 'dark' ? '\u2600 Light' : '\u263E Dark'; }
  (function () { var t; try { t = localStorage.getItem(THEME_KEY); } catch (e) {} applyTheme(t || 'dark'); })();
  document.getElementById('themeBtn').addEventListener('click', function () {
    var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(t); try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  });

  function loginUrl() { return '/auth/twitch/login?return=' + encodeURIComponent(location.pathname + location.search); }

  // Top-bar account controls: nav.js's SpirebirdNav.mountAuth, auto-mounted into
  // #authArea. loginUrl() stays — the comments panel below still needs it, which
  // is the one place on this page where a Twitch subscription is the gate.

  // ---------- header tooltip (logo + column descriptions) ----------
  (function titleTip() {
    var tip = null, cur = null;
    function el() { return tip || (tip = document.getElementById('coltip')); }
    function hide() { cur = null; var t = el(); if (t) t.style.display = 'none'; }
    function place(th) {
      var t = el(); if (!t) return;
      t.innerHTML = '<div class="t">' + esc(th.dataset.tt || '') + '</div><div class="d">' + esc(th.dataset.desc || '') + '</div>';
      t.style.display = 'block';
      var r = th.getBoundingClientRect();
      t.style.left = Math.min(r.left, window.innerWidth - t.offsetWidth - 12) + 'px';
      t.style.top = (r.bottom + 7) + 'px';
    }
    document.addEventListener('mouseover', function (e) {
      var th = e.target.closest && e.target.closest('[data-desc]');
      if (th && th !== cur) { cur = th; place(th); } else if (!th && cur) { hide(); }
    });
    document.addEventListener('mouseout', function (e) { if (cur && e.target.closest && e.target.closest('[data-desc]') === cur && !e.relatedTarget) hide(); });
    window.addEventListener('scroll', hide, true);
  })();

  // ---------- helpers ----------

      return h + '</tbody></table>';
    }
    var nm = esc(displayName);
    return head + '<div class="pairs">' +
      '<div class="paircol"><h3>Cards picked more often with ' + nm + '</h3>' + tbl(pe.pick) + '</div>' +
      '<div class="paircol"><h3>Cards that win more often with ' + nm + '</h3>' + tbl(pe.win) + '</div>' +
      '</div></div>';
  }

  // ---------- alphabetical prev/next navigation across the relic catalog ----------
  function navNeighbors() {
    if (!allRelics || !allRelics.length || !ID) return null;
    var list = allRelics.slice().filter(function (r) { return !r.deprecated; }).sort(function (a, b) { return prettyName(a.id).localeCompare(prettyName(b.id)); });
    var i = -1; for (var k = 0; k < list.length; k++) { if (String(list[k].id).toUpperCase() === ID) { i = k; break; } }
    if (i < 0) return null;
    var n = list.length;
    return { prev: list[(i - 1 + n) % n], next: list[(i + 1) % n] };
  }
  function profHeadHTML() {
    var nb = navNeighbors();
    var link = function (c, side) {
      if (!c) return '';
      return '<a class="pnav ' + side + '" href="relic.html?id=' + encodeURIComponent(c.id) + '" title="' + esc(prettyName(c.id)) + '">' +
        (side === 'prev' ? '\u2039 ' : '') + esc(prettyName(c.id)) + (side === 'next' ? ' \u203A' : '') + '</a>';
    };
    return '<div class="profhead">' +
      (nb ? link(nb.prev, 'prev') : '') +
      '<h1 class="cardname">' + esc(displayName) + '</h1>' +
      (nb ? link(nb.next, 'next') : '') +
      '</div>';
  }
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '') || t.isContentEditable)) return;
    var nb = navNeighbors(); if (!nb) return;
    var c = e.key === 'ArrowLeft' ? nb.prev : nb.next;
    if (c) location.href = 'relic.html?id=' + encodeURIComponent(c.id);
  });

  function headerBlock(row) { return profHeadHTML() + '<div class="topgrid">' + imageHTML() + '<div class="bio">' + rulesHTML() + factsHTML(row) + streakWrap(row) + '</div></div>'; }

  function streakWrap(row) {
    var s = streaks && streaks.streaks && streaks.streaks[ID];
    function box(lbl, st) {
      if (!st || !st.len) return '<div class="streakbox"><div class="lbl">' + lbl + '</div><div class="big zero">\u2014</div><div class="ctx">no winstreak recorded</div></div>';
      return '<div class="streakbox"><div class="lbl">' + lbl + '</div><div class="big">' + st.len + '</div>' +
        '<div class="span">' + fmtDate(st.startTs) + ' \u2013 ' + fmtDate(st.endTs) + '</div></div>';
    }
    var inner;
    if (!streaks) inner = '<div class="streakmuted">Winstreak data isn\u2019t published yet.</div>';
    else if (!s) inner = '<div class="streakmuted">No runs have held this relic yet.</div>';
    else inner = box('Best winstreak', s.overall) + box('Best A10 winstreak', s.a10);
    // Bespoke per-relic stats (engine registry): one stat box per row.bespoke entry,
    // same UI as the winstreak boxes, plus a mini cohort cycler (‹ all ›) under the
    // value that steps all → a10 → a10 >50% → all, independently per box and of the
    // page's Cohort dropdown. The value itself is filled in by updateBespokeBox
    // (which lazily loads the cycled cohort's shard through the existing tabCache).
    // Value null = below the spec's minimum sample — rendered as an em dash so the
    // box still says the stat exists. Adding a stat is an engine spec-table entry
    // plus a recompute; nothing changes here.
    var charts = '';
    (row && Array.isArray(row.bespoke) ? row.bespoke : []).forEach(function (b) {
      if (b.fmt === 'dist' || b.fmt === 'bars') {
        // Distribution stats render as a survived/died chart (via dist-chart.js) instead
        // of a value box; same independent cohort cycler in the header.
        charts += '<div class="bchart" data-bkey="' + esc(b.key) + '">' +
          '<div class="bchart-head">' +
            '<span class="bchart-title">' + esc(b.label || b.key) + '</span>' +
            '<span class="bcyc">' +
              '<button class="bcycbtn" data-bkey="' + esc(b.key) + '" data-dir="-1" aria-label="previous cohort">\u2039</button>' +
              '<span class="bcyclbl" id="bcyc_' + esc(b.key) + '">all</span>' +
              '<button class="bcycbtn" data-bkey="' + esc(b.key) + '" data-dir="1" aria-label="next cohort">\u203a</button>' +
            '</span>' +
          '</div>' +
          '<div class="bchart-host" id="bchart_' + esc(b.key) + '"></div>' +
        '</div>';
      } else {
        inner += '<div class="streakbox" data-bkey="' + esc(b.key) + '">' +
          '<div class="lbl">' + esc(b.label || b.key) + '</div>' +
          '<div class="big zero" id="bval_' + esc(b.key) + '">\u2026</div>' +
          '<div class="bcyc">' +
            '<button class="bcycbtn" data-bkey="' + esc(b.key) + '" data-dir="-1" aria-label="previous cohort">\u2039</button>' +
            '<span class="bcyclbl" id="bcyc_' + esc(b.key) + '">all</span>' +
            '<button class="bcycbtn" data-bkey="' + esc(b.key) + '" data-dir="1" aria-label="next cohort">\u203a</button>' +
          '</div></div>';
      }
    });
    return '<div class="streakwrap">' + inner + '</div>' + (charts ? '<div class="bchartwrap">' + charts + '</div>' : '');
  }

  function fmtBespoke(b) {
    if (!b || b.value == null) return null;
    if (b.fmt === 'pct0') return Math.round(100 * b.value) + '%';
    if (b.fmt === 'avg2') return b.value.toFixed(2);
    if (b.fmt === 'avg0') return Math.round(b.value).toString();
    return b.value.toFixed(1);   // 'avg1' and any unknown fmt
  }

  // Fill (or refresh) one bespoke box from its cycled cohort, loading that cohort's
  // relics shard on demand. The guard re-checks the element after the async load so
  // a page re-render mid-flight can't write into a stale node.
  function updateBespokeBox(key) {
    var ci = bespokeCohort[key] || 0, cohortId = BESPOKE_CYCLE[ci][0];
    var lbl = document.getElementById('bcyc_' + key);
    if (lbl) lbl.textContent = BESPOKE_CYCLE[ci][1];
    loadCohort(cohortId).then(function (rows) {
      var row = rowFor(rows);
      var b = row && Array.isArray(row.bespoke) ? row.bespoke.filter(function (x) { return x.key === key; })[0] : null;
      var chartHost = document.getElementById('bchart_' + key);
      if (chartHost) {            // chart stat -> dist histogram or simple proc-turn bars
        if (b && b.fmt === 'bars' && b.value && window.SpirebirdDistChart && window.SpirebirdDistChart.drawProcBars) {
          window.SpirebirdDistChart.drawProcBars(chartHost, b.value, { relicLabel: (b && b.label) || '' });
        } else if (b && b.fmt === 'dist' && b.value && window.SpirebirdDistChart) {
          var opts = (key === 'toyboxDisintegrate' && window.SpirebirdDistChart.toyboxOpts) ? window.SpirebirdDistChart.toyboxOpts()
            : (b && b.series === 'state' && window.SpirebirdDistChart.stateOpts) ? window.SpirebirdDistChart.stateOpts() : undefined;
          window.SpirebirdDistChart.draw(chartHost, b.value, { xLabel: (b && b.label) || '', unit: '' }, opts);
        } else {
          chartHost.innerHTML = '<div class="bchart-empty">Not enough data yet.</div>';
        }
        return;
      }
      var v = document.getElementById('bval_' + key);
      if (!v) return;
      var txt = fmtBespoke(b);
      v.textContent = txt != null ? txt : '\u2014';
      v.className = txt != null ? 'big' : 'big zero';
    });
  }

  function wireBespokeBoxes() {
    var btns = document.querySelectorAll('.bcycbtn');
    for (var i = 0; i < btns.length; i++) (function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-bkey'), dir = +btn.getAttribute('data-dir') || 1;
        bespokeCohort[key] = (((bespokeCohort[key] || 0) + dir) % BESPOKE_CYCLE.length + BESPOKE_CYCLE.length) % BESPOKE_CYCLE.length;
        updateBespokeBox(key);
      });
    })(btns[i]);
    var boxes = document.querySelectorAll('.streakbox[data-bkey], .bchart[data-bkey]');
    for (var j = 0; j < boxes.length; j++) updateBespokeBox(boxes[j].getAttribute('data-bkey'));
  }

  function rulesHTML() {
    var t = relicMeta && relicMeta.text;
    var desc = t && t.description;
    if (!desc) return '';
    var html = '<div class="rules">' + renderBB(desc) + '</div>';
    var fl = t && t.flavor;
    if (fl && fl.indexOf('revealed in the future') < 0) html += '<div class="flavor">' + renderBB(fl) + '</div>';
    return html;
  }

  function imageHTML() {
    var art = relicMeta && relicMeta.art && relicMeta.art.png;
    if (!build || !art) return '<div class="imgs"><div class="relicfig missing">no image</div></div>';
    // Era-correct art for a past design window (same hierarchy as card.html): art from
    // an exported dir inside the window if one exists; otherwise an "unavailable" box
    // with the era's rules text quoted — never another design's image.
    var era = curPatch ? eraBuildForPatch(curPatch) : { kind: 'current' };
    if (era.kind === 'missing') {
      return '<div class="imgs"><div class="relicfig missing era">relic art unavailable<br>for this version' +
        (era.oldText ? '<div class="eranote">“' + esc(era.oldText) + '”</div>' : '') + '</div></div>';
    }
    var dir = era.kind === 'era' ? era.build : build;
    var url = '/img/relics/' + dir + '/' + art;
    return '<div class="imgs"><div class="relicfig"><img src="' + esc(url) + '" alt="' + esc(displayName) +
      '" onerror="this.parentNode.outerHTML=\'<div class=&quot;relicfig missing&quot;>image missing</div>\'"></div></div>';
  }

  function factsHTML(row) {
    var rar = (relicMeta && relicMeta.rarity) || (row && row.rarity) || '';
    var pool = relicMeta && relicMeta.pool ? relicMeta.pool : '';
    var f = '<div class="facts">';
    if (rar && rar !== 'None') f += '<div class="fact"><b>Rarity:</b> <span class="rar-' + esc(rar) + '">' + esc(rar) + '</span></div>';
    var pc = poolColor(pool);
    if (pc) f += '<div class="fact"><span style="color:' + pc + ';font-weight:700">' + esc(pool) + '-only</span></div>';
    if (row && row.ancientActs) f += '<div class="fact"><b>Ancient node:</b> Act ' + esc(row.ancientActs.split('').join(', ')) + '</div>';
    if (relicMeta && relicMeta.deprecated) f += '<div class="fact"><b>Note:</b> deprecated (not in the current pool)</div>';
    if (!relicMeta) f += '<div class="fact muted">Not found in relic_data.json \u2014 stats only.</div>';
    return f + '</div>';
  }

  function summaryStrip(row) {
    if (!row) return '';
    var keys = ['war', 'warPerPick', 'vsBaseline', 'winRate', 'picked'];
    // Pick% joins the strip only on a relic that HAS an offer count (ancient/Neow,
    // starters) — on every other relic it would be a permanent em dash.
    if (typeof row.pickRate === 'number' && isFinite(row.pickRate)) keys.splice(4, 0, 'pickRate');
    var short = { war: 'WAR', warPerPick: 'WAR/Pick', vsBaseline: 'vs Base', winRate: 'Win%', pickRate: 'Pick%', picked: 'Picked' };
    var cols = '';
    keys.forEach(function (k) {
      var st = STAT_BY_K[k], v = row[k], val;
      if (k === 'picked') val = (typeof v === 'number') ? v.toLocaleString() : '\u2014';
      else val = (st && typeof v === 'number' && isFinite(v)) ? st.fmt(v) : '\u2014';
      cols += '<div class="col"' + (desc(k) ? ' title="' + esc(desc(k)) + '"' : '') + '><div class="h">' + esc(short[k]) + '</div><div class="v">' + val + '</div></div>';
    });
    return '<div class="summary"><div class="lead"><div class="lead-top">Summary</div><div class="lead-bot">' + esc(cohortLabel(curCohort)) + '</div></div>' + cols + '</div>';
  }

  function cohortSection(rows, patches) {
    var cohortOpts = '';
    visibleCohortKeys().forEach(function (k) { cohortOpts += '<option value="' + esc(k) + '"' + (k === curCohort ? ' selected' : '') + '>' + esc(cohortLabel(k)) + '</option>'; });
    var patchLinks = '';
    (patches || []).forEach(function (v, i) {
      var lbl = patchDisplay(v);
      patchLinks += (i ? ', ' : '') + (v === curPatch
        ? '<b class="patchcur">' + esc(lbl) + '</b>'
        : '<a href="#" class="patchlink" data-patch="' + esc(v) + '">' + esc(lbl) + '</a>');
    });
    var controls = '<div class="controls">' +
      '<span><label>Cohort</label><select id="cohortSel">' + cohortOpts + '</select></span>' +
      '<span><label>Versions</label><span id="patchList">' + (patchLinks || '—') + '</span></span></div>';
    var head = '<div class="section"><h2>Cohort stats</h2>' + controls;

    if (!rows.length) return head + '<p class="muted">No data published for this cohort yet.</p></div>';
    var row = rowFor(rows);
    if (!row) return head + '<p class="muted">No runs recorded on version ' + esc(patchDisplay(curPatch)) + ' in ' + esc(cohortLabel(curCohort)) + ' yet.</p></div>';

    var uni = universe(rows);
    function cell(st) {
      if (typeof row[st.k] !== 'number' || !isFinite(row[st.k])) return '<td class="val muted">\u2014</td><td class="rank"></td>';
      var rcell = '<td class="rank"></td>';
      if (!st.noRank) {
        var r = rankOf(uni, row, st.k, st.lowerBetter);
        if (r) { var p = r.of > 1 ? 1 - (r.rank - 1) / (r.of - 1) : 1; rcell = '<td class="rank" style="background:' + rankHeat(p) + ';color:' + (isDark() ? '#fff' : '#10202a') + '">#' + r.rank + ' <span class="of">/ ' + r.of + '</span></td>'; }
      }
      return '<td class="val">' + st.fmt(row[st.k]) + '</td>' + rcell;
    }

    var t = '<table class="stats"><thead><tr><th class="name">Stat</th><th>Value</th><th>Rank</th></tr></thead><tbody>';
    STATS.forEach(function (st) {
      if (st.grp) { t += '<tr class="grp"><td colspan="3">' + esc(st.grp) + '</td></tr>'; return; }
      var dn = desc(st.k);
      t += '<tr><td class="name"' + (dn ? ' title="' + esc(dn) + '"' : '') + '>' + esc(st.label) + '</td>' + cell(st) + '</tr>';
    });
    t += '<tr class="grp"><td colspan="3">Counts</td></tr>';
    COUNTS.forEach(function (c) { var v = row[c.k]; t += '<tr><td class="name">' + esc(c.label) + '</td><td class="val">' + (typeof v === 'number' ? v.toLocaleString() : '\u2014') + '</td><td class="rank"></td></tr>'; });
    t += '</tbody></table>';

    return head + summaryStrip(row) + t + byCharTable(row, uni) + '</div>';
  }

  // per-character split: only characters that actually picked this relic
  function byCharTable(row, uni) {
    var live = CHARS.filter(function (C) { return typeof row[C + '_picked'] === 'number' && row[C + '_picked'] > 0; });
    if (!live.length) return '<p class="muted">No per-character breakdown for this relic yet.</p>';
    var t = '<table class="stats" style="max-width:640px"><thead><tr><th class="name">Character</th><th>Picked</th><th>Win %</th><th>Rank</th><th>WAR</th><th>Rank</th><th>vs Base</th></tr></thead><tbody>';
    // Rank this relic's value for a (possibly per-character) field among all relics that
    // have that field — e.g. its Ironclad win% among every relic's Ironclad win%.
    function rankCell(field) {
      var r = uni ? rankOf(uni, row, field, false) : null;
      if (!r) return '<td class="rank"></td>';
      var p = r.of > 1 ? 1 - (r.rank - 1) / (r.of - 1) : 1;
      return '<td class="rank" style="background:' + rankHeat(p) + ';color:' + (isDark() ? '#fff' : '#10202a') + '">#' + r.rank + ' <span class="of">/ ' + r.of + '</span></td>';
    }
    function charRow(label, pickedF, winF, warF, vbaseF) {
      function num(v, fmt) { return '<td class="val">' + (typeof v === 'number' && isFinite(v) ? fmt(v) : '\u2014') + '</td>'; }
      var pc = poolColor(label);   // CHAR_COLORS hex per character; null for the "Overall" row
      var chCell = pc
        ? '<td class="ch" style="color:' + pc + ';font-weight:700">' + esc(label) + '</td>'
        : '<td class="ch">' + esc(label) + '</td>';
      return '<tr>' + chCell + num(row[pickedF], function (v) { return v.toLocaleString(); }) +
        num(row[winF], pct1) + rankCell(winF) + num(row[warF], f2) + rankCell(warF) + num(row[vbaseF], sgn1) + '</tr>';
    }
    t += charRow('Overall', 'picked', 'winRate', 'war', 'vsBaseline');
    live.forEach(function (C) { t += charRow(CHAR_LABEL[C] || C, C + '_picked', C + '_win', C + '_war', C + '_vbase'); });
    return t + '</tbody></table>';
  }

  // ---------- comments ----------
  // NOTE: mirrors card.html's comment API, scoped by relic id. The server must accept a
  // `relic` param on /comments, /comments/vote, /comments/delete (analogous to `card`).
  // If relics aren't wired server-side yet, this block degrades to the muted fallback.
  function loadComments() {
    var body = document.getElementById('commentsBody'); if (!body) return;
    fetch('/comments?relic=' + encodeURIComponent(ID), { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (d) { commentMe = d.me || null; renderComments(body, d.comments || []); })
      .catch(function () { body.innerHTML = '<p class="cmuted">Couldn\u2019t load comments.</p>'; });
  }
  function commentRow(c) {
    function axis(name, label, netv, mine) {
      var up = '<button class="vbtn' + (mine > 0 ? ' on' : '') + '" data-vote="' + c.id + '|' + name + '|1">\u25B2</button>';
      var dn = '<button class="vbtn' + (mine < 0 ? ' on' : '') + '" data-vote="' + c.id + '|' + name + '|-1">\u25BC</button>';
      return '<span class="vaxis"><span class="vlbl">' + label + '</span>' + up + '<span class="vnet">' + netv + '</span>' + dn + '</span>';
    }
    var mh = c.mine ? c.mine.helpful : 0, mf = c.mine ? c.mine.funny : 0;
    return '<div class="crow"><div class="cmeta"><span class="cby">' + esc(c.name) + '</span><span class="cdate">' + fmtDate(c.ts) + '</span>' +
      (c.own ? '<button class="cdel" data-del="' + c.id + '">delete</button>' : '') + '</div>' +
      '<div class="ctext">' + esc(c.text) + '</div>' +
      '<div class="cvotes">' + axis('helpful', 'Helpful', c.helpful, mh) + axis('funny', 'Funny', c.funny, mf) + '</div></div>';
  }
  function renderComments(body, list) {
    var head = (commentMe && commentMe.sub)
      ? '<div class="cform"><textarea id="cText" maxlength="1000" rows="2" placeholder="Add a comment as ' + esc(commentMe.name) + '\u2026"></textarea><button id="cPost">Post</button></div>'
      : commentMe
        ? '<div class="cmuted">Commenting and voting are for subscribers.</div>'
        : '<div class="cmuted"><a href="' + loginUrl() + '">Log in with Twitch</a> and subscribe to comment or vote.</div>';
    var rows = list.length ? list.map(commentRow).join('') : '<p class="cmuted">No comments yet' + (commentMe ? ' \u2014 be the first.' : '.') + '</p>';
    body.innerHTML = head + '<div class="clist">' + rows + '</div>';
    var pb = document.getElementById('cPost'); if (pb) pb.addEventListener('click', postComment);
    Array.prototype.forEach.call(body.querySelectorAll('[data-vote]'), function (b) { b.addEventListener('click', function () { doVote(b); }); });
    Array.prototype.forEach.call(body.querySelectorAll('[data-del]'), function (b) { b.addEventListener('click', function () { doDelete(b.getAttribute('data-del')); }); });
  }
  function doVote(btn) {
    if (!commentMe) { location.href = loginUrl(); return; }
    if (!commentMe.sub) return;   // patch 1.1: voting is subscriber-only
    var parts = btn.getAttribute('data-vote').split('|');
    var send = btn.classList.contains('on') ? 0 : (+parts[2]);
    fetch('/comments/vote', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ relic: ID, id: +parts[0], axis: parts[1], dir: send }) })
      .then(function (r) { return r.ok ? r.json() : null; }).then(function (res) { if (res) loadComments(); });
  }
  function postComment() {
    var ta = document.getElementById('cText'); var text = (ta.value || '').trim(); if (!text) return;
    var pb = document.getElementById('cPost'); pb.disabled = true;
    fetch('/comments', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ relic: ID, text: text }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.ok) { ta.value = ''; loadComments(); } else { pb.disabled = false; } })
      .catch(function () { pb.disabled = false; });
  }
  function doDelete(id) {
    fetch('/comments/delete', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ relic: ID, id: +id }) })
      .then(function (r) { return r.json(); }).then(function () { loadComments(); });
  }

    neow: ['ARCANE_SCROLL','BOOMING_CONCH','CURSED_PEARL','FISHING_ROD','GOLDEN_PEARL','HEFTY_TABLET','KALEIDOSCOPE','LARGE_CAPSULE','LAVA_ROCK','LEAD_PAPERWEIGHT','LEAFY_POULTICE','LOST_COFFER','MASSIVE_SCROLL','NEOWS_BONES','NEOWS_TALISMAN','NEOWS_TORMENT','NEW_LEAF','NUTRITIOUS_OYSTER','PHIAL_HOLSTER','POMANDER','PRECARIOUS_SHEARS','PRECISE_SCISSORS','SCROLL_BOXES','SILKEN_TRESS','SILVER_CRUCIBLE','SMALL_CAPSULE','STONE_HUMIDIFIER','WINGED_BOOTS'],
    orobas: ['ALCHEMICAL_COFFER','ARCHAIC_TOOTH','DRIFTWOOD','ELECTRIC_SHRYMP','GLASS_EYE','PRISMATIC_GEM','RADIANT_PEARL','SAND_CASTLE','SEA_GLASS','TOUCH_OF_OROBAS'],
    pael: ['PAELS_BLOOD','PAELS_CLAW','PAELS_EYE','PAELS_FLESH','PAELS_GROWTH','PAELS_HORN','PAELS_LEGION','PAELS_TEARS','PAELS_TOOTH','PAELS_WING'],
    tezcatara: ['BIIIG_HUG','GOLDEN_COMPASS','NUTRITIOUS_SOUP','PUMPKIN_CANDLE','SEAL_OF_GOLD','STORYBOOK','TOASTY_MITTENS','TOY_BOX','VERY_HOT_COCOA','YUMMY_COOKIE'],
    nonupeipe: ['BEAUTIFUL_BRACELET','BLESSED_ANTLER','BRILLIANT_SCARF','DELICATE_FROND','DIAMOND_DIADEM','FUR_COAT','GLITTER','JEWELRY_BOX','LOOMING_FRUIT','SIGNET_RING'],
    tanx: ['CLAWS','CROSSBOW','IRON_CLUB','MEAT_CLEAVER','SAI','SPIKED_GAUNTLETS','TANXS_WHISTLE','THROWING_AXE','TRI_BOOMERANG','WAR_HAMMER'],
    vakuu: ['BLOOD_SOAKED_ROSE','CHOICES_PARADOX','DISTINGUISHED_CAPE','FIDDLE','JEWELED_MASK','LORDS_PARASOL','MUSIC_BOX','PRESERVED_FOG','SERE_TALON','WHISPERING_EARRING'],
    darv: ['ASTROLABE','BLACK_STAR','CALLING_BELL','DUSTY_TOME','ECTOPLASM','EMPTY_CAGE','PANDORAS_BOX','PHILOSOPHERS_STONE','RUNIC_PYRAMID','SNECKO_EYE','SOZU','VELVET_CHOKER']
  };
  var RELIC_ANCIENT = {};
  ANC_ORDER.forEach(function (k) { ANC_RELICS[k].forEach(function (id) { RELIC_ANCIENT[id] = k; }); });

  // ---------- browse / index (no ?id) ----------
  function renderIndex(el) {
    var pools = ['Ironclad', 'Silent', 'Regent', 'Necrobinder', 'Defect', 'Fool', 'Shared', 'Event'];
    var rars = ['Starter', 'Common', 'Uncommon', 'Rare', 'Shop', 'Event', 'Ancient'];
    function opt(v, l, sel) { return '<option value="' + v + '"' + (sel ? ' selected' : '') + '>' + l + '</option>'; }
    function selBox(id, label, opts) { return '<span><label>' + label + '</label><select id="' + id + '">' + opts + '</select></span>'; }
    var poolOpts = '<option value="">All</option>' + pools.map(function (g) { return opt(g, g); }).join('');
    var rarOpts = '<option value="">All</option>' + rars.map(function (r) { return opt(r, r); }).join('');

    el.innerHTML = '<div class="idxhead"><h1>Relic Profiles</h1>' +
      '<input class="idxsearch" id="relicSearch" placeholder="Search\u2026" autocomplete="off"></div>' +
      '<div class="filterbar controls">' + selBox('fPool', 'Source', poolOpts) + selBox('fRarity', 'Rarity', rarOpts) +
      '<span class="count" id="idxCount"></span></div>' +
      '<div class="grid" id="relicGrid"></div>';

    var grid = document.getElementById('relicGrid');
    var sorted = allRelics.slice().filter(function (r) { return !r.deprecated; }).sort(function (a, b) { return prettyName(a.id).localeCompare(prettyName(b.id)); });
    grid.innerHTML = sorted.map(function (r) {
      var art = r.art && r.art.png, nm = prettyName(r.id), has = build && art;
      var thumb = has
        ? '<span class="thumb"><img data-src="/img/relics/' + build + '/' + art + '" alt="" onerror="this.style.visibility=\'hidden\'"></span>'
        : '<span class="thumb noimg"><span class="ph">no image</span></span>';
      var anc = RELIC_ANCIENT[r.id] || '', am = anc ? ANCIENTS[anc] : null;
      var badge = am
        ? '<span class="ancbadge"><span class="dot" style="background:' + am.color + '"></span>' + esc(am.name) + '</span>'
        : '';
      return '<a class="tile" href="relic.html?id=' + encodeURIComponent(r.id) + '"' +
        ' data-nm="' + esc((nm + ' ' + r.id).toLowerCase()) + '"' +
        ' data-pool="' + esc(r.pool || '') + '" data-rarity="' + esc(r.rarity || '') + '"' +
        ' data-ancient="' + anc + '" data-acts="' + (am ? am.acts.join(',') : '') + '">' +
        badge + thumb + '<span class="nm">' + esc(nm) + '</span></a>';
    }).join('');

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var img = en.target.querySelector('img[data-src]');
          if (img) { img.src = img.getAttribute('data-src'); img.removeAttribute('data-src'); }
          io.unobserve(en.target);
        });
      }, { rootMargin: '300px' });
      Array.prototype.forEach.call(grid.children, function (t) { io.observe(t); });
    } else {
      Array.prototype.forEach.call(grid.querySelectorAll('img[data-src]'), function (img) { img.loading = 'lazy'; img.src = img.getAttribute('data-src'); img.removeAttribute('data-src'); });
    }

    // Act aliases in the search box. Typing "a2" / "act2" / "act 2" / "[act 2]"
    // filters to the relics of that act (Darv counts for both 2 and 3 via data-acts).
    // Typing an act's ancient names ("orobas pael tezcatara", with or without Darv,
    // space- or +-separated) autoreplaces the box with the canonical "[act 2]" alias,
    // so the shortcut is emergently discoverable. The per-tile badges show attribution.
    function aliasAct(s) {
      var m = s.match(/^\[?\s*act\s*([1-3])\s*\]?$/) || s.match(/^a\s*([1-3])$/);
      return m ? +m[1] : null;
    }
    function sameSet(a, b) {
      if (a.length !== b.length) return false;
      var seen = {}; a.forEach(function (x) { seen[x] = 1; });
      return b.every(function (x) { return seen[x]; });
    }
    function ancientSetAct(s) {
      var toks = s.split(/[\s+]+/).filter(Boolean);
      if (toks.length < 2) return null;
      for (var i = 0; i < toks.length; i++) if (ANC_ORDER.indexOf(toks[i]) < 0) return null;
      for (var act = 1; act <= 3; act++) {
        var excl = ANC_ORDER.filter(function (k) { return ANCIENTS[k].acts.length === 1 && ANCIENTS[k].acts[0] === act; });
        var full = ANC_ORDER.filter(function (k) { return ANCIENTS[k].acts.indexOf(act) > -1; });
        if (sameSet(toks, excl) || sameSet(toks, full)) return act;
      }
      return null;
    }

    function apply() {
      var search = document.getElementById('relicSearch');
      var raw = (search.value || '').trim().toLowerCase();
      var setAct = ancientSetAct(raw);
      if (setAct) { search.value = '[act ' + setAct + ']'; raw = search.value; }
      var act = aliasAct(raw), q = act ? '' : raw;
      var pv = document.getElementById('fPool').value, rv = document.getElementById('fRarity').value;
      var n = 0, tiles = grid.children;
      for (var i = 0; i < tiles.length; i++) {
        var t = tiles[i], show = true;
        if (act) { if ((t.getAttribute('data-acts') || '').split(',').indexOf(String(act)) < 0) show = false; }
        else if (q && t.getAttribute('data-nm').indexOf(q) < 0) show = false;
        if (show && pv && (t.getAttribute('data-pool') || '') !== pv) show = false;
        if (show && rv && (t.getAttribute('data-rarity') || '') !== rv) show = false;
        t.style.display = show ? '' : 'none';
        if (show) n++;
      }
      document.getElementById('idxCount').textContent = n + ' relics';
    }
    ['relicSearch', 'fPool', 'fRarity'].forEach(function (id) {
      var elx = document.getElementById(id);
      elx.addEventListener(id === 'relicSearch' ? 'input' : 'change', apply);
    });
    apply();
  }
})();
</script>
